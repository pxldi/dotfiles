# Whenever a Bluetooth output is connected, it should win.
#
# Bluetooth sinks default to priority.session 1010 against the built-in
# speaker's 1000 - close enough that a stored preference for another device
# keeps overriding them. Raising them well clear makes headphones take over
# the moment they connect, without having to pick them by hand each time.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
]
