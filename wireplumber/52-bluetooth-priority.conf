# Bluetooth device rules.
#
# 1. Whenever a Bluetooth output is connected, it should win.
#    Bluetooth sinks default to priority.session 1010 against the built-in
#    speaker's 1000 - close enough that a stored preference for another device
#    keeps overriding them. Raising them well clear makes headphones take over
#    the moment they connect, without having to pick them by hand each time.
#
# 2. Never restore a saved "off" profile for a Bluetooth card.
#    When a Bluetooth transport fails mid-switch, WirePlumber can store "off"
#    as the card's preferred profile. That preference is sticky: every later
#    connect restores it, so the device pairs and connects but exposes no sink
#    at all. session.dont-restore-off-profile makes the restore hook skip a
#    stored profile at index 0, so a failed session cannot poison the next one
#    - the card falls through to normal priority selection (a2dp-sink, AAC).
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        session.dont-restore-off-profile = true
      }
    }
  }
]
