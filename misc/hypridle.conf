# Idle behaviour. hypridle is autostarted from niri/cfg/autostart.kdl, and
# without a config it starts and does nothing at all.
#
# Locking goes through Noctalia rather than hyprlock: Noctalia owns the lock
# screen, and its login box is what hosts/<profile>/noctalia/settings.toml
# places per output. Blanking goes through niri's own DPMS action.

general {
    # loginctl lock-session, the session menu and the Mod+L keybind all end here.
    lock_cmd = pgrep -x noctalia >/dev/null && noctalia msg session lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
