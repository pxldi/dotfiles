[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
# niri implements Mutter's ScreenCast API, so the GNOME portal handles screen
# sharing. It has no Screenshot backend here though - that one needs GNOME
# Shell's own D-Bus API, which niri does not provide - so screenshots go to
# the wlroots portal, which uses wlr-screencopy and works.
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.Screenshot=wlr;
