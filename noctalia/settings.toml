[plugin_settings."sappler/next-meeting"]
agenda_open_near_click = true
panel_font_size = 16

[plugin_settings."yuuto/arch-updater"]
auto_check_hours = 1

[plugins]
enabled = [
    "noctalia/wallhaven",
    "felipeartur/ai-usagebar",
    "yuuto/arch-updater",
    "dotnetrob/cat",
    "kenn/keybind-cheatsheet",
    "sappler/next-meeting",
    "sappler/media-controls",
    "sappler/teams-status"
]

[shell.screenshot]
copy_to_clipboard = true
save_to_file = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/sappler/Pictures/wallhaven-3919wv.jpg"

[wallpaper.last]
path = "/home/sappler/Pictures/wallhaven-3919wv.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/sappler/Pictures/wallhaven-3919wv.jpg"

[widget.bar]
scale = 1.4000000000000001
show_glyph = false
show_name = true
type = "felipeartur/ai-usagebar:bar"
vendor = "anthropic"
visualization = "gauge"

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.mc_next]
type = "sappler/media-controls:next"

[widget.mc_play]
type = "sappler/media-controls:play_pause"

[widget.mc_prev]
type = "sappler/media-controls:previous"

[widget.media]
hide_when_no_media = true
max_length = 180
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.next_meeting]
join_window_minutes = 5
type = "sappler/next-meeting:next_meeting"

[widget.teams]
type = "sappler/teams-status:teams"

[widget.tray]
drawer = true
drawer_columns = 4
hidden = [ "teams-for-linux_status_icon_1" ]
hide_passive = true

[widget.widget]
type = "yuuto/arch-updater:widget"