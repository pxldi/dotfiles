config_version = 14

[bar.default]
center = [ "clock" ]
end = [ "group:quick", "teams", "tray", "notifications", "battery", "control-center" ]
start = [ "group:nav", "next_meeting", "weather", "group:meta" ]
widget_spacing = 10

    [bar.default.monitor.laptop]
    center = [ "clock" ]
    end = [ "group:quick", "teams", "tray", "notifications", "battery", "control-center" ]
    margin_ends = 12
    match = "eDP-1"
    start = [ "group:nav", "next_meeting" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "nav"
    members = [ "launcher", "workspaces" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "meta"
    members = [ "bar", "widget", "cat" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "quick"
    members = [ "privacy", "mc_prev", "mc_play", "mc_next", "media", "output_volume", "brightness", "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

